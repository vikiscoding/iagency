[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iagency"
version = "0.2.0"
description = "Deterministic human-gate spine: policy, optional brief compressor, hash-chained ledger"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
iagency = "iagency.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["iagency"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
